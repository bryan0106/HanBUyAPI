services:
  - type: web
    name: dbexpress
    env: node
    plan: free
    buildCommand: npm ci --production=false
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false  # Set this manually in Render dashboard
      - key: JWT_SECRET
        sync: false  # Set this manually in Render dashboard (use a strong random string)
      - key: FRONTEND_URL
        sync: false  # Set this manually in Render dashboard (e.g., https://your-frontend.onrender.com)
      - key: ALLOWED_ORIGINS
        sync: false  # Comma-separated list of allowed origins (e.g., https://han-b-uy.vercel.app,https://example.com)
      - key: ALLOW_VERCEL_PREVIEWS
        value: "true"  # Set to "false" to disable Vercel preview deployments pattern
      - key: PORT
        value: "10000"  # Render sets this automatically, but specifying helps

